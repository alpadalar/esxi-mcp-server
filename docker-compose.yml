services:
  esxi-mcp-server:
    build: .
    image: esxi-mcp-server:local
    container_name: esxi-mcp-server
    restart: unless-stopped
    ports:
      # bound to loopback on the host; put a TLS reverse proxy in front for remote access
      - "127.0.0.1:8080:8080"
    environment:
      VCENTER_HOST: ${VCENTER_HOST:?set VCENTER_HOST}
      VCENTER_USER: ${VCENTER_USER:?set VCENTER_USER}
      VCENTER_PASSWORD_FILE: /run/secrets/vcenter_password
      MCP_API_KEY_HASH: ${MCP_API_KEY_HASH:?generate with `esxi-mcp-server hash-key`}
      VCENTER_DATACENTER: ${VCENTER_DATACENTER:-}
      VCENTER_CLUSTER: ${VCENTER_CLUSTER:-}
      VCENTER_DATASTORE: ${VCENTER_DATASTORE:-}
      VCENTER_NETWORK: ${VCENTER_NETWORK:-}
      VCENTER_INSECURE: ${VCENTER_INSECURE:-false}
      VCENTER_CA_BUNDLE: ${VCENTER_CA_BUNDLE:-}
      MCP_READ_ONLY: ${MCP_READ_ONLY:-false}
      MCP_ALLOW_DESTRUCTIVE: ${MCP_ALLOW_DESTRUCTIVE:-false}
      MCP_LOG_LEVEL: ${MCP_LOG_LEVEL:-INFO}
    secrets:
      - vcenter_password
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits: { memory: 512M, cpus: "0.5" }

secrets:
  vcenter_password:
    file: ./secrets/vcenter_password   # create locally; git-ignored
