# Copy to config/config.yaml (git-ignored). NO SECRETS HERE:
#   - vCenter password:  env VCENTER_PASSWORD or VCENTER_PASSWORD_FILE (or `vcenter_password_file` below)
#   - API key:           store only its hash: `esxi-mcp-server hash-key` -> MCP_API_KEY_HASH
vcenter_host: "vcenter.example.com"
vcenter_user: "svc-mcp@vsphere.local"
# vcenter_password_file: "/run/secrets/vcenter_password"
vcenter_port: 443
datacenter: ""        # empty = first datacenter
cluster: ""           # empty = first compute resource (standalone ESXi host)
datastore: ""         # empty = datastore with most free space
network: "VM Network"

# TLS verification is ON by default. Prefer a CA bundle over disabling it.
insecure: false
# ca_bundle: "/etc/ssl/certs/my-vcenter-ca.pem"

transport: stdio            # stdio | streamable-http
host: 127.0.0.1             # use 0.0.0.0 only inside a container / behind a reverse proxy
port: 8080
path: /mcp
# api_key_hash: "sha256:..."   # prefer env MCP_API_KEY_HASH; REQUIRED for streamable-http
# allowed_hosts: ["mcp.example.com"]

# Safety gates
read_only: false
allow_destructive: false    # deleteVM, powerOff, resetVM, revert/removeSnapshot
task_timeout: 600
max_vm_cpus: 64
max_vm_memory_mb: 1048576

log_level: INFO
